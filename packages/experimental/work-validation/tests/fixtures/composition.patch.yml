- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- id: session-title-llm
  disabled: true
- id: agent-loop
  config:
    agents:
      - id: main
        provider: validation-mock
        model: validation-mock
        cwd: !!js process.cwd()
- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
- insert:
    - id: validation-mock
      name: './mock.ts'
    - id: work-validation
      name: '../../src/index.ts'
      config:
        enabled: true
- id: sandbox-policy
  inject: []
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()
